databases:
  - name: wedsnap-db
    databaseName: wedsnap
    user: wedsnap_user
    plan: free
    region: singapore

services:
  - type: web
    name: wedsnap-platform
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wedsnap-db
          property: connectionString

