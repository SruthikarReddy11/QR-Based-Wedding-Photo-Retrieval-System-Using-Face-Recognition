version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. AI Vision Microservice (YuNet + ArcFace ResNet-50 512D)
  # -------------------------------------------------------------
  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: wedsnap-ai-service
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - MODELS_DIR=/models
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Node.js Backend API Server
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wedsnap-api
    restart: always
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-wedsnap_production_secret_key_change_me_9831}
      - APP_URL=${APP_URL:-http://localhost}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. High-Performance Web Frontend (Nginx + React SPA)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: wedsnap-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    # To enable automatic SSL with HTTPS, you can map port 443 or put Cloudflare / Caddy in front

networks:
  default:
    name: wedsnap-network
